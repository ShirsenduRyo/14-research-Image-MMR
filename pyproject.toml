[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "image-rerank-lab"
version = "0.1.0"
description = "Reproducible relevance-diversity-latency experiments for image retrieval reranking"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Image Rerank Lab contributors" }]
keywords = ["image-retrieval", "reranking", "CLIP", "diversity", "MMR", "DPP"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "datasets>=3.0",
  "huggingface-hub>=0.26",
  "pyarrow>=15.0",
  "torch>=2.7",
  "torchvision>=0.22",
  "open-clip-torch>=2.26",
  "transformers>=4.45",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "ipykernel>=6.29",
  "ipython>=8.20",
  "nbclient>=0.10",
  "jupyterlab>=4.2",
  "notebook>=7.2",
  "nbformat>=5.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/image_rerank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["image_rerank"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true